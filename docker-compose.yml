version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kelpus-postgres
    environment:
      POSTGRES_DB: kelpus
      POSTGRES_USER: kelpus
      POSTGRES_PASSWORD: kelpus_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kelpus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelpus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kelpus-redis
    ports:
      - "6379:6379"
    networks:
      - kelpus-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: kelpus-backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    networks:
      - kelpus-net
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  kelpus-net:
    driver: bridge
