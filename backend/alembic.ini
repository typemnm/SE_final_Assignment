# Alembic 설정 파일
# 실행: alembic upgrade head

[alembic]
# 마이그레이션 스크립트 경로
script_location = migrations

# `alembic` console script는 실행 파일 경로(/usr/local/bin)를 sys.path[0]으로
# 사용하므로 프로젝트 루트를 명시적으로 추가해야 app 패키지를 임포트할 수 있다.
prepend_sys_path = .

# 마이그레이션 파일 이름 형식: 001_add_users.py
file_template = %%(rev)s_%%(slug)s

# DB URL은 env.py에서 환경변수로 읽음 (여기서는 비워둠)
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
