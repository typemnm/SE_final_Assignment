# Alembic 설정 파일
# 실행: alembic upgrade head

[alembic]
# 마이그레이션 스크립트 경로
script_location = migrations

# 마이그레이션 파일 이름 형식: 001_add_users.py
file_template = %%(rev)s_%%(slug)s

# DB URL은 env.py에서 환경변수로 읽음 (여기서는 비워둠)
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
